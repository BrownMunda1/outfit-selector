services:

  backend:
    image: brownmunda/outfit-selector-backend:latest
    ports:
      - "8000:8000"
      # "HOST_PORT:CONTAINER_PORT"
    # env_file:
    #   - .env
      # Load environment variables from a .env file on EC2

    restart: always
    # If the container crashes, Docker automatically restarts it

  frontend:
    image: brownmunda/outfit-selector-backend:latest
    ports:
      - "3000:3000"
    depends_on:
      - backend
      # Docker will start backend before frontend
    restart: always
