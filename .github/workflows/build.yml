name: AWS Pipeline
run-name: AWS Pipeline

on:
  push:
    branches: [ main ]

env:
    IMAGE_PREFIX: ${{secrets.DOCKERHUB_USERNAME}}/outfit-selector


jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
            python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
            node-version: 24

      - name: Create Virtual Environment and Install Backend Dependencies
        working-directory: src/backend
        run: |
          python -m venv .venv
          echo "Created Virtual Environment"
          source .venv/bin/activate
          echo "Activated Virtual Environment"
          pip install -r requirements.txt

      - name: Install Frontend Dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
            registry: docker.io
            username: ${{ secrets.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Successful Login to Docker Hub
        run: echo "Logged in to Docker Hub"

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
            context: ./src/backend
            push: true
            tags: ${{ env.IMAGE_PREFIX }}-backend:latest

      - name: Successful Pushed Backend Image
        run: echo "Successfully Pushed Backend Image to Docker Hub"

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
            context: ./src/frontend
            push: true
            tags: ${{ env.IMAGE_PREFIX }}-frontend:latest

      - name: Successful Pushed Frontend Image
        run: echo "Successfully Pushed Frontend Image to Docker Hub"

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo ${{ secrets.DOCKERHUB_TOKEN }} | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

            # Manually created this app folder. Make sure to have docker installed in the ec2 instance. Also make sure that the machine is added to docker groups
            cd /home/ubuntu/app
            docker compose pull
            docker compose up -d
            docker image prune -f
