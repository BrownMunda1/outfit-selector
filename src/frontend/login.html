<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Login - Outfit Selector</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">👔</div>
                <h1 class="auth-title">Outfit Selector</h1>
            </div>

            <div class="auth-welcome">
                <h2>Welcome Back</h2>
                <p>Sign in to your account and start styling</p>
            </div>

            <form id="loginForm" aria-label="Login form" class="auth-form">
                <div class="form-field">
                    <label for="username" class="form-label">Username</label>
                    <div class="input-wrapper">
                        <span class="input-icon">👤</span>
                        <input id="username" name="username" type="text" placeholder="Enter your username"
                            autocomplete="username" required class="form-input" />
                    </div>
                    <span class="field-error" id="usernameError"></span>
                </div>

                <div class="form-field">
                    <div class="form-label-row">
                        <label for="password" class="form-label">Password</label>
                        <a href="#" class="forgot-link">Forgot?</a>
                    </div>
                    <div class="input-wrapper">
                        <span class="input-icon">🔒</span>
                        <input id="password" name="password" type="password" placeholder="Enter your password"
                            autocomplete="current-password" required class="form-input" />
                        <button type="button" class="toggle-password" id="togglePassword"
                            aria-label="Toggle password visibility">👁️</button>
                    </div>
                    <span class="field-error" id="passwordError"></span>
                </div>

                <div id="msg" aria-live="polite" class="auth-message"></div>

                <button type="submit" class="auth-button" id="loginBtn">
                    <span>Sign in</span>
                    <span class="button-icon">→</span>
                </button>
            </form>

            <div class="auth-divider">
                <span>New to Outfit Selector?</span>
            </div>

            <a href="/register.html" class="auth-link-button">
                <span>Create an account</span>
                <span class="button-arrow">→</span>
            </a>
        </div>

        <div class="auth-decoration">
            <div class="decoration-item">✨</div>
            <div class="decoration-item">👗</div>
            <div class="decoration-item">👠</div>
        </div>
    </div>
    <script src="./auth.js"></script>
</body>

</html>
